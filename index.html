  <nav class="nav-bar">
    <span class="page-indicator" id="page-indicator">תלמוד בבלי</span>

    <label for="tractate-select">מסכת:</label>
    <select id="tractate-select">
      <option value="">— בחר מסכת —</option>
    </select>

    <label for="page-select">דף:</label>
    <select id="page-select">
      <option value="">— בחר דף —</option>
    </select>

    <div class="nav-buttons">
      <button id="btn-prev" disabled title="דף קודם">◄ הקודם</button>
      <button id="btn-next" disabled title="דף הבא">הבא ►</button>
    </div>

    <div class="settings-wrap">
      <button id="btn-settings" title="הגדרות תצוגה">…</button>
      <div id="settings-panel" class="settings-panel" hidden></div>
    </div>

    <button id="btn-print" title="הדפסה — דף שלם בשחור-לבן (בחר גודל נייר בחלון ההדפסה)" aria-label="הדפסה">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9V2h12v7"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
    </button>

    <button id="btn-reset" title="איפוס: מחיקת כל ההגדרות, הגופנים, הבחירות והעוגיות וחזרה לברירת המחדל">↺</button>
  </nav>

  <script src="js/context-sidebar.js"></script>
  <script src="js/chavruta/provider.js"></script>
  <script src="js/chavruta/chatkit.js"></script>
  <script src="js/chavruta/contextBuilder.js"></script>
  <script src="js/chavruta/sessionManager.js"></script>
  <script src="js/chavruta/suggestedQuestions.js"></script>
  <script src="js/chavruta/deepLink.js"></script>
  <script src="js/chavruta/chatUI.js"></script>
  <script src="js/chavruta/chavruta.js"></script>
  <script src="vilna-daf.js"></script>
  <script>
    // ── Bootstrap ────────────────────────────────────────────
    (async () => {
      // ── Settings: persisted source selection ───────────────
      const SETTINGS_KEY = 'vilnaDafSettings';
      function loadSettings() {
        try {
          const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
          if (s && typeof s === 'object') return s;
        } catch (e) { /* corrupted — fall back to defaults */ }
        return {};
      }
      function saveSettings(s) {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
      }

      const renderer = new VilnaDaf({ container: '#daf-content', settings: loadSettings() });
      const tractates = await renderer.getTractates();

      // ── Settings panel ("…" menu) ──────────────────────────
      const settingsBtn = document.getElementById('btn-settings');
      const panel = document.getElementById('settings-panel');
      const GROUP_TITLES = { rishonim: 'ראשונים', acharonim: 'אחרונים', modern: 'בני ימינו' };

      function buildPanel() {
        const s = renderer.settings;
        const editionRadios = Object.entries(VilnaDaf.EDITIONS).map(([id, ed]) =>
          `<label><input type="radio" name="set-edition" value="${id}" ${s.edition === id ? 'checked' : ''}> ${ed.he}</label>`
        ).join('');
        const wrapOptions = sel => VilnaDaf.WRAP_COMMENTARIES.map(c =>
          `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${c.he}</option>`
        ).join('');
        const groups = ['rishonim', 'acharonim', 'modern'].map(g => {
          const boxes = VilnaDaf.EXTRA_COMMENTARIES.filter(c => c.group === g).map(c =>
            `<label><input type="checkbox" name="set-extra" value="${c.id}" ${(s.extras || []).includes(c.id) ? 'checked' : ''}> ${c.he}</label>`
          ).join('');
          return `<h4>${GROUP_TITLES[g]}</h4><div class="opt-grid">${boxes}</div>`;
        }).join('');
        const fontRadios = (name, value, def) => {
          const std = value === 'rashi' || value === 'frank' || !value;
          const cur = value || def;
          return `<label><input type="radio" name="${name}" value="rashi" ${cur === 'rashi' ? 'checked' : ''}> כתב רש״י</label>
            <label><input type="radio" name="${name}" value="frank" ${cur === 'frank' ? 'checked' : ''}> פרנק־ריהל (קריא יותר)</label>
            <label><input type="radio" name="${name}" value="custom" ${std ? '' : 'checked'}> מותאם אישית:
              <input type="text" class="set-customfont" data-for="${name}" placeholder="שם גופן (CSS)"
                     value="${std ? '' : String(cur).replace(/"/g, '&quot;')}"></label>`;
        };
        const pct = Math.round((s.fontScale || 1) * 100);
        panel.innerHTML =
          `<h3>נוסח הגמרא</h3>${editionRadios}` +
          `<h3>עמודות הפירוש</h3>
           <div class="set-row">
             <div><h4>פנימית (צד הכריכה)</h4><select id="set-inner">${wrapOptions(s.inner)}</select></div>
             <div><h4>חיצונית</h4><select id="set-outer">${wrapOptions(s.outer)}</select></div>
           </div>` +
          `<h3>שפת המפרשים</h3>
           <label><input type="radio" name="set-lang" value="he" ${s.lang !== 'en' ? 'checked' : ''}> עברית</label>
           <label><input type="radio" name="set-lang" value="en" ${s.lang === 'en' ? 'checked' : ''}> English</label>` +
          `<h3>גופן וגודל</h3>
           <h4>גופן המפרשים</h4>${fontRadios('set-commfont', s.commFont, 'rashi')}
           <h4>גופן הגמרא</h4>${fontRadios('set-gemfont', s.gemaraFont, 'frank')}
           <h4>גודל הגופן</h4>
           <label><input type="range" id="set-fontscale" min="0.7" max="1.5" step="0.05" value="${s.fontScale || 1}">
             <span id="set-fontscale-val">${pct}%</span></label>` +
          `<h3>מפרשים נוספים</h3>${groups}` +
          `<div class="hint">מקור שאינו קיים לדף הנוכחי יושמט מהתצוגה.</div>` +
          `<button class="set-reset" id="set-reset">איפוס לברירת המחדל</button>`;
      }

      function fontPatch(name) {
        const key = name === 'set-commfont' ? 'commFont' : 'gemaraFont';
        const sel = panel.querySelector(`input[name="${name}"]:checked`);
        const custom = panel.querySelector(`.set-customfont[data-for="${name}"]`);
        const v = sel && sel.value === 'custom' ? (custom.value.trim() || null) : sel && sel.value;
        if (v) applyPanel({ [key]: v });
      }

      async function applyPanel(patch) {
        saveSettings(Object.assign({}, renderer.settings, patch));
        try { await renderer.updateSettings(patch); } catch (e) { console.error(e); }
      }

      panel.addEventListener('change', e => {
        const t = e.target;
        if (t.name === 'set-edition') applyPanel({ edition: t.value });
        else if (t.name === 'set-lang') applyPanel({ lang: t.value });
        else if (t.id === 'set-inner') applyPanel({ inner: t.value });
        else if (t.id === 'set-outer') applyPanel({ outer: t.value });
        else if (t.name === 'set-commfont' || t.name === 'set-gemfont') fontPatch(t.name);
        else if (t.classList.contains('set-customfont')) {
          const name = t.dataset.for;
          const radio = panel.querySelector(`input[name="${name}"][value="custom"]`);
          if (radio) radio.checked = true;
          fontPatch(name);
        }
        else if (t.id === 'set-fontscale') applyPanel({ fontScale: parseFloat(t.value) });
        else if (t.name === 'set-extra') {
          const extras = [...panel.querySelectorAll('input[name="set-extra"]:checked')].map(x => x.value);
          applyPanel({ extras });
        }
      });
      // Live percentage label while dragging; the re-render fires on release.
      panel.addEventListener('input', e => {
        if (e.target.id === 'set-fontscale') {
          panel.querySelector('#set-fontscale-val').textContent = `${Math.round(e.target.value * 100)}%`;
        }
      });
      panel.addEventListener('click', e => {
        if (e.target.id === 'set-reset') {
          renderer.settings = Object.assign({}, VilnaDaf.DEFAULT_SETTINGS);
          buildPanel();
          applyPanel({});
        }
      });
      settingsBtn.addEventListener('click', () => {
        if (panel.hidden) buildPanel();
        panel.hidden = !panel.hidden;
      });
      document.addEventListener('click', e => {
        if (!panel.hidden && !e.target.closest('.settings-wrap')) panel.hidden = true;
      });

      // ── Print: black-on-white framed daf; the browser dialog picks the
      //    paper size. The whole carved sheet is scaled down as one rigid
      //    unit (transform: scale) so every column fits on one physical page
      //    with no reflow of the carve geometry. ──
      //
      //  SAFE_W/SAFE_H = the common printable area of Letter (216×279mm) and
      //  A4 (210×297mm) at the @page 10mm margins, in CSS px @96dpi:
      //    width  = min(210,216) − 20mm = 190mm ≈ 718px
      //    height = min(279,297) − 20mm = 259mm ≈ 979px
      //  Using the *intersection* guarantees a single-page fit on either paper.
      const PRINT_SAFE_W = 700, PRINT_SAFE_H = 960; // px, small safety inset
      function beforePrint() {
        const sheet = document.querySelector('.page-sheet');
        const dc = document.getElementById('daf-content');
        if (!sheet || !dc) return;
        const W = sheet.offsetWidth, H = sheet.offsetHeight;
        if (!W || !H) return;
        // Smaller of the two fit ratios; never enlarge (cap at 1).
        const k = Math.min(PRINT_SAFE_W / W, PRINT_SAFE_H / H, 1);
        // Stash whatever inline values zoom/pan left so we can restore them.
        sheet.dataset.ptf = sheet.style.transform || '';
        sheet.dataset.por = sheet.style.transformOrigin || '';
        sheet.dataset.pos = sheet.style.position || '';
        // Reserve the *scaled* layout box so the page reflows to fit (no blank
        // 2nd page) and the 800px sheet doesn't push page width out.
        dc.style.position = 'relative';
        dc.style.width = (W * k) + 'px';
        dc.style.height = (H * k) + 'px';
        dc.style.margin = '0 auto';
        // Scale the sheet as one rigid unit from its top-right corner (RTL).
        sheet.style.position = 'absolute';
        sheet.style.top = '0';
        sheet.style.right = '0';
        sheet.style.transformOrigin = 'top right';
        sheet.style.transform = 'scale(' + k + ')';
      }
      function afterPrint() {
        const sheet = document.querySelector('.page-sheet');
        const dc = document.getElementById('daf-content');
        if (dc) { dc.style.position = ''; dc.style.width = ''; dc.style.height = ''; dc.style.margin = ''; }
        if (sheet) {
          sheet.style.transform = sheet.dataset.ptf || '';
          sheet.style.transformOrigin = sheet.dataset.por || '';
          sheet.style.position = sheet.dataset.pos || '';
          sheet.style.top = ''; sheet.style.right = '';
        }
      }
      window.addEventListener('beforeprint', beforePrint);
      window.addEventListener('afterprint', afterPrint);
      document.getElementById('btn-print').addEventListener('click', () => window.print());

      // ── Reset: clear all persisted state and return to defaults ──
      document.getElementById('btn-reset').addEventListener('click', () => {
        if (!confirm('לאפס את כל ההגדרות, הגופנים, הגדלים, הבחירות והעוגיות ולחזור לברירת המחדל?')) return;
        // localStorage: every key this site owns (settings, chavruta provider/sessions).
        try {
          for (const k of Object.keys(localStorage)) {
            if (/^vilna/i.test(k)) localStorage.removeItem(k);
          }
        } catch (e) {}
        // Artifact persistent storage, if present (chavruta sessions).
        try { if (window.storage && window.storage.removeItem) window.storage.removeItem('vilnaChavruta.v1'); } catch (e) {}
        // Cookies (e.g. Google Analytics _ga*) — expire on every domain scope.
        try {
          const host = location.hostname;
          const domains = ['', host, '.' + host, host.replace(/^[^.]+\./, '.')];
          for (const c of document.cookie.split(';')) {
            const name = c.split('=')[0].trim();
            if (!name) continue;
            for (const d of domains) {
              document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/' + (d ? ';domain=' + d : '');
            }
          }
        } catch (e) {}
        // Reload fresh on the default daf (Berachot 2a) with default settings.
        location.replace(location.pathname + '?tractate=Berachot&page=2&side=a');
      });

      // ── Populate navigation ────────────────────────────────
      const tractateSel = document.getElementById('tractate-select');
      const pageSel = document.getElementById('page-select');
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      const indicator = document.getElementById('page-indicator');

      let currentTractate = null, currentInfo = null;
      let currentPage = 2, currentSide = 'a';

      for (const t of tractates) {
        const opt = document.createElement('option');
        opt.value = t.name_en;
        opt.textContent = `${t.name_he} — ${t.name_en}`;
        tractateSel.appendChild(opt);
      }

      function populatePages(info) {
        pageSel.innerHTML = '';
        if (!info) return;
        for (let p = 2; p <= info.last_page; p++) {
          pageSel.appendChild(pageOption(p, 'a'));
          if (p < info.last_page || info.ends_on_b) pageSel.appendChild(pageOption(p, 'b'));
        }
      }
      function pageOption(p, s) {
        const o = document.createElement('option');
        o.value = `${p}-${s}`;
        o.textContent = `${VilnaDaf.heb(p)} ${s === 'a' ? 'ע״א' : 'ע״ב'}`;
        return o;
      }
      function updateButtons() {
        prevBtn.disabled = (currentPage === 2 && currentSide === 'a');
        const last = currentInfo?.last_page || 0;
        const eb = currentInfo?.ends_on_b || false;
        nextBtn.disabled = eb ? (currentPage === last && currentSide === 'b') : (currentPage === last && currentSide === 'a');
      }

      async function go(tractate, page, side) {
        currentTractate = tractate; currentPage = page; currentSide = side;
        currentInfo = tractates.find(t => t.name_en === tractate);
        populatePages(currentInfo);
        pageSel.value = `${page}-${side}`;
        tractateSel.value = tractate;
        updateButtons();
        try {
          const model = await renderer.load(tractate, page, side);
          indicator.textContent = `${model.tractateHe || tractate} ${VilnaDaf.heb(page)} ${side === 'a' ? 'ע״א' : 'ע״ב'}`;
          // Update URL without reload
          const url = new URL(location);
          url.searchParams.set('tractate', tractate);
          url.searchParams.set('page', page);
          url.searchParams.set('side', side);
          history.replaceState(null, '', url);
        } catch(e) { console.error(e); }
      }

      tractateSel.addEventListener('change', () => {
        const v = tractateSel.value;
        if (!v) return;
        const info = tractates.find(t => t.name_en === v);
        go(v, info.first_page || 2, 'a');
      });
      pageSel.addEventListener('change', () => {
        const [p, s] = pageSel.value.split('-');
        go(currentTractate, parseInt(p), s);
      });
      prevBtn.addEventListener('click', () => {
        if (currentSide === 'b') { currentSide = 'a'; }
        else if (currentPage > 2) { currentPage--; currentSide = 'b'; }
        else return;
        go(currentTractate, currentPage, currentSide);
      });
      nextBtn.addEventListener('click', () => {
        const last = currentInfo?.last_page || 0;
        const eb = currentInfo?.ends_on_b || false;
        if (currentSide === 'a') {
          if (currentPage < last || eb) currentSide = 'b'; else return;
        } else { currentPage++; currentSide = 'a'; }
        go(currentTractate, currentPage, currentSide);
      });

      // Keyboard: left=next, right=prev
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); nextBtn.click(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); prevBtn.click(); }
      });

      // ── Load from URL or default ───────────────────────────
      const params = new URLSearchParams(location.search);
      const startTractate = params.get('tractate') || params.get('masechet') || params.get('m');
      if (startTractate) {
        const startPage = parseInt(params.get('page') || params.get('daf') || params.get('d') || '2');
        const startSide = (params.get('side') || params.get('amud') || params.get('s') || 'a').toLowerCase();
        await go(startTractate, startPage, startSide);
      } else {
        populatePages(tractates.find(t => t.name_en === 'Berachot'));
      }
    })();
  </script>
